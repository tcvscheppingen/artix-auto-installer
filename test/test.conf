# Preset answers for the container test. Never use these passwords for real.
DISK=__LOOP__
HOST_NAME=artix-test
USER_NAME=tester
USER_PASSWORD='user pass 123'
LUKS_PASSWORD='luks-test-passphrase'
ENABLE_ROOT=no
TIMEZONE=Europe/Amsterdam
KEYMAP=us-acentos
LOCALE=en_US.UTF-8
SWAP_SIZE=1
INSTALL_LTS=yes
ENABLE_TIMESHIFT=yes
INSTALL_NVIDIA=yes
AUDIO_LEGACY_HDA=yes
# Building yay (Go) crashes now and then under x86 emulation
ENABLE_AUR=no
CONFIRM_WIPE=yes
SAVE_SUMMARY=yes
REBOOT_WHEN_DONE=no
# DESKTOP comes from --desktop; the boot test logs in through the greeter
DESKTOP_LOGIN=dm

# --- test only ---
ALLOW_NO_UEFI=yes
# Passphrase prompt on the serial port for expect
EXTRA_KERNEL_PARAMS='console=tty0 console=ttyS0,115200'
# Default Argon2id takes minutes to unlock under TCG
LUKS_FORMAT_OPTS='--pbkdf argon2id --pbkdf-memory 65536 --pbkdf-force-iterations 4'
# Under Rosetta the CPU shows up as "VirtualApple"
CPU_VENDOR=intel
# Pretend a hybrid Intel + Quadro T500 laptop
NVIDIA_ID=0x1fbb
OTHER_GPU=yes
INTEL_AUDIO_DSP=yes
# The container shares the host's kernel: own mapping names, no EFI/clock/keymap
CRYPT_NAME=artixtest-root
TEST_IN_CONTAINER=yes
# Docker can't run pacman's download sandbox
PACMAN_CHROOT_OPTS=--disable-sandbox
# Docker volume, shared between runs
PACMAN_CACHE_DIR=/pkgcache
