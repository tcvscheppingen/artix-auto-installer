# Preset answers for the automated container test (see run-container-test.sh).
# Never use these passwords on a real machine.
DISK=__LOOP__
HOST_NAME=t14s-test
USER_NAME=tester
USER_PASSWORD='user pass 123'
LUKS_PASSWORD='luks-test-passphrase'
ENABLE_ROOT=no
TIMEZONE=Europe/Amsterdam
KEYMAP=us-acentos
LOCALE=en_US.UTF-8
SWAP_SIZE=1
INSTALL_LTS=yes
INSTALL_TIMESHIFT=yes
ENABLE_AUR=yes
CONFIRM_WIPE=yes
REBOOT_WHEN_DONE=no

# --- deviations needed for the test only ---
# The container has no UEFI firmware (the QEMU boot test does).
ALLOW_NO_UEFI=yes
# Put the kernel console (and so the passphrase prompt) on the serial port,
# so expect can type the passphrase.
EXTRA_KERNEL_PARAMS='console=tty0 console=ttyS0,115200'
# Cheap key derivation: the boot test runs on an emulated (TCG) CPU, where
# the default Argon2id settings take minutes to unlock.
LUKS_FORMAT_OPTS='--pbkdf argon2id --pbkdf-memory 65536 --pbkdf-force-iterations 4'
# The container's CPU shows up as "VirtualApple" (Rosetta); install the
# T14s Gen 2 (Intel) package set: intel-ucode, vulkan-intel, intel-media-driver.
CPU_VENDOR=intel
# Docker can't run pacman 7's download sandbox (the Artix Docker image
# disables it in its own pacman.conf); the live ISO can.
PACMAN_CHROOT_OPTS=--disable-sandbox
