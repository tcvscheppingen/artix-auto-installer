# Preset answers for the automated container test (see run-container-test.sh).
# Never use these passwords on a real machine.
DISK=__LOOP__
HOST_NAME=artix-test
USER_NAME=tester
USER_PASSWORD='user pass 123'
LUKS_PASSWORD='luks-test-passphrase'
ENABLE_ROOT=no
TIMEZONE=Europe/Amsterdam
KEYMAP=us-acentos
LOCALE=en_US.UTF-8
SWAP_SIZE=1
INSTALL_LTS=yes
ENABLE_TIMESHIFT=yes
INSTALL_NVIDIA=yes
AUDIO_LEGACY_HDA=yes
# no: building yay (Go) crashes now and then under x86 emulation on Apple Silicon
ENABLE_AUR=no
CONFIRM_WIPE=yes
SAVE_SUMMARY=yes
REBOOT_WHEN_DONE=no
# DESKTOP comes from run-container-test.sh --desktop. sway and dwm start from
# the LightDM login screen, so the boot test can log in through it.
DESKTOP_LOGIN=dm

# --- deviations needed for the test only ---
# No UEFI firmware in the container (the QEMU boot test has it)
ALLOW_NO_UEFI=yes
# Passphrase prompt on the serial port, for expect
EXTRA_KERNEL_PARAMS='console=tty0 console=ttyS0,115200'
# Default Argon2id takes minutes to unlock on the emulated (TCG) CPU
LUKS_FORMAT_OPTS='--pbkdf argon2id --pbkdf-memory 65536 --pbkdf-force-iterations 4'
# Under Rosetta the CPU shows up as "VirtualApple"
CPU_VENDOR=intel
# No GPU in the container: pretend an RTX 3060 to test the driver install
NVIDIA_ID=0x2560
# and Intel audio with a DSP, to test the older HDA driver option
INTEL_AUDIO_DSP=yes
# The container shares the host's kernel, firmware and clock: use mapping
# names of its own, and don't touch EFI boot entries, the clock or the keymap
CRYPT_NAME=artixtest-root
TEST_IN_CONTAINER=yes
# Docker can't run pacman's download sandbox
PACMAN_CHROOT_OPTS=--disable-sandbox
# A Docker volume, so the runs don't download the same packages again
PACMAN_CACHE_DIR=/pkgcache
