# Preset answers for the automated container test (see run-container-test.sh).
# Never use these passwords on a real machine.
DISK=__LOOP__
HOST_NAME=t14s-test
USER_NAME=tester
USER_PASSWORD='user pass 123'
LUKS_PASSWORD='luks-test-passphrase'
ENABLE_ROOT=no
TIMEZONE=Europe/Amsterdam
KEYMAP=us-acentos
LOCALE=en_US.UTF-8
SWAP_SIZE=1
INSTALL_LTS=yes
ENABLE_AUR=yes
CONFIRM_WIPE=yes
REBOOT_WHEN_DONE=no

# --- deviations needed for the test only ---
# No UEFI firmware in the container (the QEMU boot test has it)
ALLOW_NO_UEFI=yes
# Passphrase prompt on the serial port, for expect
EXTRA_KERNEL_PARAMS='console=tty0 console=ttyS0,115200'
# Default Argon2id takes minutes to unlock on the emulated (TCG) CPU
LUKS_FORMAT_OPTS='--pbkdf argon2id --pbkdf-memory 65536 --pbkdf-force-iterations 4'
# Under Rosetta the CPU shows up as "VirtualApple"
CPU_VENDOR=intel
# Docker can't run pacman's download sandbox
PACMAN_CHROOT_OPTS=--disable-sandbox
